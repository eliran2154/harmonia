<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>הזמנה - הרמוניה</title><style>:root{--g:#c9a84c;--g2:#e8c97a;--b:#0f0f1a;--c:#16213e;--bd:#2a3f60;--t:#f0ead6}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--b);color:var(--t);margin:0;min-height:100vh;padding-bottom:calc(100px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}header{position:sticky;top:0;z-index:10;background:var(--c);padding:calc(16px + env(safe-area-inset-top)) 16px 14px;text-align:center;border-bottom:2px solid var(--g)}header small{color:var(--g);letter-spacing:3px}h1{margin:3px 0 0;font-size:24px}.w{padding:10px}.title{color:var(--g2);font-weight:800;font-size:16px;margin:14px 4px 8px;padding-bottom:5px;border-bottom:1px solid var(--bd);text-align:right;direction:rtl}.row{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:10px;background:var(--c);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;margin-bottom:7px;direction:rtl}.row span{flex:1;font-size:14px;text-align:right;direction:rtl}.gap{height:16px}.q{display:flex;direction:rtl;flex:0 0 auto;border:1px solid var(--bd);border-radius:8px;overflow:hidden}.q button,.q input{width:36px;height:34px;border:0;background:var(--b);color:var(--t);text-align:center;font-size:16px}.q button{color:var(--g);font-size:20px}textarea{width:100%;min-height:70px;background:var(--c);color:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px;font-family:inherit}.warn{text-align:center;color:var(--g2);font-weight:700;margin:12px 0}footer{position:fixed;bottom:0;left:0;right:0;background:var(--b);border-top:2px solid var(--g);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center}.send{padding:0 18px;height:42px;border:0;background:#25D366;color:#fff;border-radius:10px;font-weight:700}</style></head><body><header><small>✦ הזמנה ✦</small><h1>הרמוניה</h1></header><div class="w" id="list"></div><footer><div><b id="count">0</b> פריטים</div><button class="send" onclick="sendOrder()">שלח הזמנה</button></footer><script>const PHONE='972544274897',RET='‼️*לידע נהג לקח החזרות*‼️',RLM='\u200F',LRM='\u200E';const G=[['צלופן ארוז 250 י״ח',['גליל','10/15','10/20','18/25','20/30','20/50 (25 י״ח)','25/35','30/40','35/45 (25 י״ח)','40/50','50/60','60/70']],['דליה 17/25',['זהב פס בורדו','בורדו עיטורים','זהב מנוקד']],['דליה 26/28',['זהב פס בורדו','בורדו עיטורים','זהב מנוקד','פפיון']],['דליה 33/45',['זהב פס בורדו','בורדו עיטורים','זהב מנוקד','פפיון']],['דליה 40/50',['זהב פס בורדו','בורדו עיטורים','זהב מנוקד','פפיון','פרפרים','פרחים','לוי ביטון','ג׳ינס']],['דליה 50/60',['זהב פס בורדו','בורדו עיטורים','זהב מנוקד','פפיון','פרחים','לוי ביטון']],['דליה 60/70',['זהב פס בורדו','בורדו עיטורים','זהב מנוקד','פפיון']],['סרט בלון',['לבן','שחור','כסף','זהב','סגול בהיר','סגול כהה','תכלת','כחול','ירוק','ירקרק','כתום','צהוב','אדום','ורוד']],['סרט משיכה 23 מטאלי',['לבן','כסף','זהב','ורוד','אדום','תכלת','כחול']],['סרט משיכה 50 מטאלי',['לבן','כסף','זהב','ורוד','אדום','תכלת','כחול']],['גליל עטיפה למתנה',['50 מטאלי זהב','50 מטאלי כסף','70 מטאלי זהב','70 מטאלי כסף','70 עיתון']],['נייר גרוס',['חום','לבן']],['',[RET]]];const L=document.getElementById('list');G.forEach((g,gi)=>{if(gi)L.insertAdjacentHTML('beforeend','<div class="gap"></div>');if(g[0]){const t=document.createElement('div');t.className='title';t.textContent=g[0];L.appendChild(t)}g[1].forEach(p=>{const r=document.createElement('div');r.className='row';r.dataset.group=gi;r.innerHTML='<span></span><div class="q"><button onclick="chg(this,-1)">−</button><input type="number" min="0" value="0" inputmode="numeric"><button onclick="chg(this,1)">+</button></div>';r.querySelector('span').textContent=p;r.querySelector('input').oninput=refresh;L.appendChild(r)})});L.insertAdjacentHTML('beforeend','<textarea id="notes" placeholder="הערות להזמנה..."></textarea><div class="warn">‼️ דווח חוסרים בהקדם האפשרי ‼️</div>');function chg(b,d){const i=b.parentElement.querySelector('input');i.value=Math.max(0,(parseInt(i.value)||0)+d);refresh()}function refresh(){let t=0;document.querySelectorAll('.row input').forEach(i=>t+=parseInt(i.value)||0);count.textContent=t}function orderLine(name,q){const W=38,p=' '.repeat(Math.max(2,W-[...name].length));return '```'+RLM+'• '+name+RLM+':'+p+LRM+q+RLM+'```'}function titleLine(t){return RLM+'*'+t+'*'+RLM}function sendOrder(){const lines=['🛒 *הזמנה - הרמוניה*','📅 '+new Date().toLocaleDateString('he-IL'),'─────────────────'];let total=0;G.forEach((g,gi)=>{const sel=[];document.querySelectorAll('.row[data-group="'+gi+'"]').forEach(r=>{const q=parseInt(r.querySelector('input').value)||0;if(q>0){sel.push(orderLine(r.querySelector('span').textContent,q));total+=q}});if(sel.length){lines.push('');if(g[0])lines.push(titleLine(g[0]));lines.push(...sel)}});if(!total){alert('לא נבחרו פריטים');return}const n=notes.value.trim();if(n)lines.push('','📝 *הערות:* '+n);lines.push('','─────────────────','✅ סה״כ: *'+total+' פריטים*','','‼️ *דווח חוסרים בהקדם האפשרי* ‼️','','*אשר*');const msg=lines.map(x=>RLM+x+RLM).join('\n');location.href='https://wa.me/'+PHONE+'?text='+encodeURIComponent(msg)}</script></body></html>
